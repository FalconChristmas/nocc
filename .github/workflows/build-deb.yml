# FalconChristmas/nocc — build nocc .debs and publish into fpp-apt's pool.
#
# This fork IS the pinned, org-controlled nocc source. packaging/buildNOCC*.sh
# (copied from FalconChristmas/fpp) build it; no cross-repo checkout of fpp.
#
# Requires repo secret FPP_APT_TOKEN: a token with contents:write on fpp-apt.
name: build-deb

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nocc (this fork = the source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so buildNOCC-deb.sh's `git describe` works

      - name: Unit tests (64-bit and 32-bit)
        run: |
          # Run the tests under a 32-bit GOARCH as well, not just the runner's
          # amd64. FPP's clients include armv7 boards (BeagleBone, Pi Zero/1)
          # where int is 32 bits, and at least one bug -- a hash reduced modulo
          # the server count in signed int, which went negative and panicked the
          # daemon -- could not reproduce on a 64-bit host at all. Pure-Go test
          # binaries need no 32-bit runtime libraries to execute here.
          go test ./internal/...
          GOARCH=386 go test ./internal/...

      - name: Install cross toolchains + dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf g++-aarch64-linux-gnu dpkg-dev

      - name: Build debs (arm64, amd64)
        run: |
          chmod +x packaging/*.sh
          for a in arm64 amd64; do
            packaging/buildNOCC-deb.sh --arch "$a" --src "$PWD" --out "$PWD/out" --work "$PWD/work"
          done

      - name: Build armhf deb (ARMv6 wrapper via dockcross, for Pi Zero/1)
        run: |
          # The Go binaries are ARMv6 (GOARM=6), but the C++ wrapper needs a real
          # ARMv6 toolchain -- Debian's armhf toolchain is ARMv7 and would fault
          # on a Pi Zero/1. So build Go + a throwaway wrapper, rebuild the wrapper
          # with dockcross/linux-armv6, verify it is v6, then package that.
          packaging/buildNOCC.sh --arch armhf --src "$PWD" --out "$PWD/bin-armhf" --work "$PWD/work"
          docker run --rm dockcross/linux-armv6 > ./dcross && chmod +x ./dcross
          ./dcross bash -c '$CXX -std=c++11 -O3 -o bin-armhf/nocc cmd/nocc.cpp'
          echo "armhf wrapper: $(readelf -A bin-armhf/nocc | grep -oE 'Tag_CPU_arch: v[0-9A-Za-z]+')"
          readelf -A bin-armhf/nocc | grep -q 'Tag_CPU_arch: v6' \
            || { echo 'ERROR: armhf wrapper is not ARMv6 -- would fault on Pi Zero/1'; exit 1; }
          packaging/buildNOCC-deb.sh --arch armhf --src "$PWD" --bin-dir "$PWD/bin-armhf" --out "$PWD/out"
          ls -l out/*.deb

      - name: Checkout fpp-apt (pool target)
        uses: actions/checkout@v4
        with:
          repository: FalconChristmas/fpp-apt
          path: fpp-apt
          token: ${{ secrets.FPP_APT_TOKEN }}

      - name: Add debs to pool and push
        run: |
          MSG=$(ls out/nocc_*_amd64.deb 2>/dev/null | xargs -n1 basename | head -1)
          mkdir -p fpp-apt/pool/main/n/nocc
          cp out/nocc_*_*.deb fpp-apt/pool/main/n/nocc/
          cd fpp-apt
          git config user.name  "fpp-bot"
          git config user.email "fpp-bot@users.noreply.github.com"
          git add pool
          if git diff --cached --quiet; then
            echo "No pool changes."
          else
            git commit -m "nocc: ${MSG:-update}"
            git push
          fi
